<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Tip calculator app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="logo">
      <img src="images/logo.svg" alt="" />
    </div>
    <main class="container">
      <div class="col1">
        <h6>Bill</h6>

        <input type="number" id="billamount" class="bill" value="0" />

        <br />
        <h6>Select Tip %</h6>
        <div class="pers">
          <div class="percent active">5%</div>
          <div class="percent">10%</div>
          <div class="percent">15%</div>
        </div>

        <div class="pers">
          <div class="percent">25%</div>
          <div class="percent">50%</div>
          <input
            class="percent inputpercent"
            type="number"
            placeholder="Custom"
            id="customPercent"
          />
        </div>
        <br />
        <h6>Number of People</h6>
        <input type="number" class="numofppl" id="numOfPll" value="0" />
      </div>

      <div class="col2">
        <div class="price">
          <div class="pcol1">
            <div class="prow1">Tip Amount</div>
            <div class="prow2">/ person</div>
          </div>
          <div class="pcol2" id="tipAmount">$0.000</div>
        </div>
        <div class="price">
          <div class="pcol1">
            <div class="prow1">Total</div>
            <div class="prow2">/ person</div>
          </div>
          <div class="pcol2" id="tolAmount">$0.000</div>
        </div>

        <button class="reset" id="resetBtn">Reset</button>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
